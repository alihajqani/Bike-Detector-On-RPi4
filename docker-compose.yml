services:
  detector-cam0:
    build: .
    container_name: bike_detector_cam0
    restart: unless-stopped
    privileged: true
    shm_size: '512m'
    devices:
      - /dev/video0:/dev/video0
    ports:
      - "8000:8000"
    environment:
      - CAMERA_DEVICE=/dev/video0
      - THRESHOLD=0.45
      - LOG_LEVEL=WARNING
    volumes:
      - ./models:/app/models
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  detector-cam1:
    build: .
    container_name: bike_detector_cam1
    restart: unless-stopped
    privileged: true
    shm_size: '512m'
    devices:
      - /dev/video2:/dev/video2
    ports:
      - "8001:8000"
    environment:
      - CAMERA_DEVICE=/dev/video2
      - THRESHOLD=0.45
      - LOG_LEVEL=WARNING
    volumes:
      - ./models:/app/models
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3